services:
  api:
    build: .
    environment:
      API_PORT: "8080"
      API_HOST: "0.0.0.0"
      DATABASE_URL: postgres://qa_platform:${DEMO_DB_PASSWORD:?Generate local .env credentials}@postgres:5432/qa_platform?sslmode=disable
      QA_SOURCE_IDENTITIES: ${QA_SOURCE_IDENTITIES:?Set QA_SOURCE_IDENTITIES in .env}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: qa_platform
      POSTGRES_USER: qa_platform
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Generate local .env credentials}
    ports:
      - "127.0.0.1:54332:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qa_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - qa_postgres:/var/lib/postgresql/data
      - ./supabase/migrations:/docker-entrypoint-initdb.d:ro

volumes:
  qa_postgres:
